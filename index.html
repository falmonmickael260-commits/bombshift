<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07060c" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="preload" as="image" href="./logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="BOMBSHIFT - jeu de labyrinthe a bombes, 3 cartes, 3 boss." />
    <title>BOMBSHIFT</title>
  </head>
  <body>
    <div id="app">
      <!-- Zone de rendu Phaser -->
      <div id="game-root" aria-hidden="true"></div>

      <!-- Chargement -->
      <section id="screen-loading" class="screen screen--active">
        <div class="logo-wrap">
          <img class="logo" src="./logo.png" alt="BOMBSHIFT" width="760" height="380" />
        </div>
        <div class="loading-bar"><div class="loading-bar__fill" id="loading-fill"></div></div>
        <p class="loading-text" id="loading-text">Forge des textures...</p>
      </section>

      <!-- Menu principal -->
      <section id="screen-title" class="screen">
        <div class="title-top">
          <div class="logo-wrap logo-wrap--small">
            <img class="logo" src="./logo.png" alt="BOMBSHIFT" width="760" height="380" />
          </div>
          <p class="tagline">Trois forteresses. Trois boss. Une seule meche.</p>
        </div>
        <nav class="menu">
          <button class="btn btn--resume" id="btn-resume-run" data-action="resume-run" hidden>
            REPRENDRE LA PARTIE
            <span class="btn__sub" id="resume-sub"></span>
          </button>
          <button class="btn btn--primary" data-action="play">JOUER</button>
          <button class="btn" data-action="progress">PROGRESSION</button>
          <button class="btn" data-action="settings">PARAMETRES</button>
          <button class="btn btn--ghost" data-action="howto">COMMENT JOUER</button>
        </nav>
        <p class="version">v1.0 &middot; moteur Phaser 3 &middot; hors ligne</p>
      </section>

      <!-- Selection de carte -->
      <section id="screen-maps" class="screen">
        <header class="bar">
          <button class="icon-btn" data-action="back-title" aria-label="Retour">&#8592;</button>
          <h2>CHOISIR UNE CARTE</h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="map-list" id="map-list"></div>
      </section>

      <!-- Briefing -->
      <section id="screen-brief" class="screen">
        <header class="bar">
          <button class="icon-btn" data-action="back-maps" aria-label="Retour">&#8592;</button>
          <h2 id="brief-title">CARTE</h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="panel scroll" id="brief-body"></div>
        <div class="actions">
          <button class="btn btn--primary" data-action="start">COMMENCER</button>
        </div>
      </section>

      <!-- Parametres -->
      <section id="screen-settings" class="screen">
        <header class="bar">
          <button class="icon-btn" data-action="back-auto" aria-label="Retour">&#8592;</button>
          <h2>PARAMETRES</h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="panel scroll" id="settings-body"></div>
      </section>

      <!-- Progression -->
      <section id="screen-progress" class="screen">
        <header class="bar">
          <button class="icon-btn" data-action="back-title" aria-label="Retour">&#8592;</button>
          <h2>PROGRESSION</h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="panel scroll" id="progress-body"></div>
      </section>

      <!-- Aide -->
      <section id="screen-howto" class="screen">
        <header class="bar">
          <button class="icon-btn" data-action="back-title" aria-label="Retour">&#8592;</button>
          <h2>COMMENT JOUER</h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="panel scroll" id="howto-body"></div>
      </section>

      <!-- Resultat -->
      <section id="screen-result" class="screen">
        <div class="result" id="result-body"></div>
      </section>

      <!-- HUD en jeu -->
      <div id="hud" class="hud" hidden>
        <div class="hud-top">
          <div class="hud-chip hud-lives" id="hud-lives"></div>
          <div class="hud-chip" id="hud-bombs"></div>
          <div class="hud-chip" id="hud-range"></div>
          <div class="hud-chip hud-time" id="hud-time">0:00</div>
          <button class="icon-btn icon-btn--hud" id="btn-pause" aria-label="Pause">&#10073;&#10073;</button>
        </div>
        <div class="hud-objectives" id="hud-objectives"></div>
        <div class="hud-boss" id="hud-boss" hidden>
          <div class="hud-boss__name" id="hud-boss-name"></div>
          <div class="hud-boss__bar"><div class="hud-boss__fill" id="hud-boss-fill"></div></div>
          <div class="hud-boss__state" id="hud-boss-state"></div>
        </div>
        <div class="toasts" id="toasts"></div>
      </div>

      <!-- Commandes tactiles -->
      <div id="controls" class="controls" hidden>
        <div class="stick" id="stick">
          <div class="stick__base"></div>
          <div class="stick__thumb" id="stick-thumb"></div>
        </div>
        <div class="buttons">
          <button class="action-btn action-btn--ability" id="btn-ability2" hidden>
            <span class="action-btn__label">LENTE</span>
            <span class="action-btn__cd" id="cd-ability2"></span>
          </button>
          <button class="action-btn action-btn--ability" id="btn-ability" hidden>
            <span class="action-btn__label">SHIFT</span>
            <span class="action-btn__cd" id="cd-ability"></span>
          </button>
          <button class="action-btn action-btn--bomb" id="btn-bomb">
            <span class="action-btn__glyph"></span>
          </button>
        </div>
      </div>

      <!-- Pause -->
      <section id="screen-pause" class="screen screen--overlay">
        <div class="panel panel--center">
          <h2>PAUSE</h2>
          <canvas id="pause-minimap" class="minimap" width="520" height="400"></canvas>
          <p class="minimap-legend">
            <span class="legend legend--player">Vous</span>
            <span class="legend legend--objective">Objectif</span>
            <span class="legend legend--boss">Boss</span>
            <span class="legend legend--exit">Sortie</span>
          </p>
          <div id="pause-objectives" class="pause-objectives"></div>
          <div class="actions actions--column">
            <button class="btn btn--primary" data-action="resume">REPRENDRE</button>
            <button class="btn" data-action="pause-settings">PARAMETRES</button>
            <button class="btn" data-action="restart">RECOMMENCER</button>
            <button class="btn btn--danger" data-action="quit">QUITTER</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
